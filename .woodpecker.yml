steps:

  lint:
    image: python:3.14-slim
    commands:
      - pip install --upgrade pip
      - pip install -e .[lint]

      - ruff check . --output-format=github
      - ruff format --check .

      - mypy . --install-types --non-interactive --check-untyped-defs
    when:
      - event: push
        branch: main
      - event: pull_request

  test:
    image: python:3.14-slim
    commands:
      - pip install --upgrade pip
      - pip install -e .[test]
      - pytest --cov=datorum --cov-fail-under=100 -v
    when:
      - event: push
        branch: main
      - event: pull_request
