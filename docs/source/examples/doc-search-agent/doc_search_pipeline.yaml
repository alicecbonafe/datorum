# PlumbingKit config for the "Doc Search Agent" tutorial.

id: doc-search-agent
description: >
  Scaffold a per-domain file-selection checklist, pause for the user to pick
  files and write a prompt, optionally run a small "searcher" pass over the
  selected files, then answer with a larger "answerer" model.

first_step_id: list-files

steps:
  list-files:
    type: tool
    toolbox_setup:
      field_id: toolbox_setup
      factory_name: toolbox_setup
      selector: doc_search.scaffold_selection
    tool_params:
      field_id: tool_params
      binded_id: scratch
      context: docs
      context_bind_type: document-metadata
      local: false
    tool_result:
      field_id: tool_result
      binded_id: scratch
      context: docs
      context_bind_type: document-metadata
      local: false
    target_id: edit-selection

  edit-selection:
    type: human
    interactive:
      field_id: interactive
      binded_id: selection
      context: docs
      context_bind_type: model
      local: true
    target_id: build-history

  build-history:
    type: tool
    toolbox_setup:
      field_id: toolbox_setup
      factory_name: toolbox_setup
      selector: doc_search.build_chat_history
    tool_params:
      field_id: tool_params
      binded_id: scratch
      context: docs
      context_bind_type: document-metadata
      local: false
    tool_result:
      field_id: tool_result
      binded_id: scratch
      context: docs
      context_bind_type: document-metadata
      local: false
    target_id: check-selection

  check-selection:
    type: decision
    input_data:
      field_id: input_data
      binded_id: selection
      context: docs
      context_bind_type: document-metadata
      local: true
    code_type: formula
    code: "'search-first' if input_data.get('any_selected') else 'final-inference'"
    target_options: [search-first, final-inference]

  search-first:
    type: agent
    chat_history:
      field_id: chat_history
      binded_id: chat
      context: docs
      context_bind_type: model
      local: true
    inference_provider:
      field_id: inference_provider
      factory_name: provider
      selector: mistral
    agent_role:
      field_id: agent_role
      factory_name: agent_role
      selector: searcher
    target_id: final-inference

  final-inference:
    type: agent
    chat_history:
      field_id: chat_history
      binded_id: chat
      context: docs
      context_bind_type: model
      local: true
    inference_provider:
      field_id: inference_provider
      factory_name: provider
      selector: deepseek
    agent_role:
      field_id: agent_role
      factory_name: agent_role
      selector: answerer
    # no target_id -- pipeline ends here