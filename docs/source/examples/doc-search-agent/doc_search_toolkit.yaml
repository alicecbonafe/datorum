# Toolkit config: registers a ToolBoxSetUp for the "doc_search" toolbox.

toolkit:
  toolboxes:
    doc_search:
      id: doc_search
      toolbox_name: doc_search
      tools_enabled: [scaffold_selection, build_chat_history, search]
      context_bindings:
        - field_id: domain
          binded_id: domain
          context: docs
          context_bind_type: domain-path
          local: false
        - field_id: interactive
          binded_id: selection
          context: docs
          context_bind_type: model
          local: true
        - field_id: interactive_metadata
          binded_id: selection
          context: docs
          context_bind_type: document-metadata
          local: true
        - field_id: agent_chat
          binded_id: chat
          context: docs
          context_bind_type: model
          local: true
      resource_bindings:
        - field_id: agent_role
          factory_name: agent_role
          selector: answerer