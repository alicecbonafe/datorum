[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datorum"
version = "0.1.0"
description = "Data scraping and LLM dataset extraction pipeline"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Datorum Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "pytest_httpserver>=1.1",
    "beautifulsoup4>=4.15",
    "pyyaml>=6.0",
    "typer>=0.27",
    "cryptography>=49.0",
    "openai>=2.47"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "responses>=0.26",
    "ruff>=0.16",
    "mypy>=2.3",
]

[project.scripts]
datorum = "datorum.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datorum*"]
exclude = ["data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=datorum --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"