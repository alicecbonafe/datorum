[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datorum"
version = "0.1.0a1.dev4"
description = "Context engineering AI agent."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Datorum Team" }]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=49.0",
    "openai>=2.47",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "pytest_httpserver>=1.1",
    "beautifulsoup4>=4.15",
    "pyyaml>=6.0",
    "requests>=2.34",
    "typer>=0.27",
    "keyring>=25.7",
    "tomli_w>=1.2",
    "RestrictedPython>=8.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "pytest-depends>=1.0",
    "ruff>=0.16",
    "mypy>=2.3",
]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "pytest-depends>=1.0",
]
lint = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "pytest-depends>=1.0",
    "ruff>=0.16",
    "mypy>=2.3",
]

[project.scripts]
datorum = "datorum.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["datorum*"]
exclude = ["data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=datorum --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"